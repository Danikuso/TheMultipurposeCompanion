<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMC — Autenticación Frontier Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --hud-bg: #07090e;
      --hud-bg-radial: radial-gradient(circle at 50% 10%, #121829 0%, #07090e 75%);
      --hud-surface: rgba(15, 18, 29, 0.88);
      --hud-primary: #ff7100;
      --hud-primary-glow: rgba(255, 113, 0, 0.2);
      --hud-cyan: #06b6d4;
      --hud-cyan-glow: rgba(6, 182, 212, 0.2);
      --hud-success: #22c55e;
      --hud-danger: #ef4444;
      --hud-text: #f3f4f6;
      --hud-muted: #9ca3af;
      --hud-border: rgba(255, 113, 0, 0.3);
      --hud-border-cyan: rgba(6, 182, 212, 0.35);
      --hud-border-subtle: rgba(255, 255, 255, 0.08);
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Rajdhani', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--hud-bg-radial);
      color: var(--hud-text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .cockpit-card {
      width: 100%;
      max-width: 520px;
      background: var(--hud-surface);
      border: 1px solid var(--hud-border-cyan);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 25px var(--hud-cyan-glow);
      border-radius: 12px;
      padding: 2.2rem;
      backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .cockpit-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--hud-cyan), transparent);
    }

    .badge-bar {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid var(--hud-border-cyan);
      border-radius: 9999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--hud-cyan);
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    .title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--hud-muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 1.8rem;
    }

    /* Radar / Spinner */
    .radar-box {
      margin: 1.5rem auto;
      width: 64px;
      height: 64px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--hud-cyan);
      animation: pulse 1.6s ease-out infinite;
      opacity: 0.8;
    }

    .radar-inner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--hud-cyan);
      box-shadow: 0 0 15px var(--hud-cyan);
    }

    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .status-msg {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--hud-cyan);
      margin-bottom: 1.5rem;
      padding: 0.75rem;
      background: rgba(6, 182, 212, 0.08);
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: var(--hud-primary);
      color: #fff;
      box-shadow: 0 0 15px var(--hud-primary-glow);
    }
    .btn-primary:hover {
      background: #ff8c24;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--hud-text);
      border: 1px solid var(--hud-border-subtle);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .manual-box {
      margin-top: 1.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--hud-border-subtle);
      text-align: left;
    }

    .manual-box p {
      font-size: 0.8rem;
      color: var(--hud-muted);
      margin-bottom: 0.5rem;
    }

    .code-snippet {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--hud-border-subtle);
      border-radius: 4px;
      padding: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--hud-cyan);
      word-break: break-all;
      user-select: all;
    }
  </style>
</head>
<body>

  <div class="cockpit-card">
    <div class="badge-bar">TMC · Frontier Companion API</div>
    <h1 class="title" id="main-title">Enlace de Cabina</h1>
    <p class="subtitle" id="sub-title">Transfiriendo código de autorización a tu instalación local de TMC...</p>

    <div class="radar-box" id="radar">
      <div class="radar-pulse"></div>
      <div class="radar-inner"></div>
    </div>

    <div class="status-msg" id="status-text">
      Detectando TMC en http://127.0.0.1:47320...
    </div>

    <div class="btn-group" id="actions-group">
      <a href="#" id="direct-btn" class="btn btn-primary" style="display:none;">Abrir en TMC</a>
      <button id="copy-btn" class="btn btn-secondary" style="display:none;">Copiar Código</button>
    </div>

    <div class="manual-box" id="manual-box" style="display:none;">
      <p>Código de autorización recibido de Frontier:</p>
      <div class="code-snippet" id="auth-code-view"></div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDesc = params.get('error_description');

      const titleEl = document.getElementById('main-title');
      const subTitleEl = document.getElementById('sub-title');
      const radarEl = document.getElementById('radar');
      const statusEl = document.getElementById('status-text');
      const directBtn = document.getElementById('direct-btn');
      const copyBtn = document.getElementById('copy-btn');
      const manualBox = document.getElementById('manual-box');
      const codeView = document.getElementById('auth-code-view');

      if (error) {
        titleEl.textContent = 'Error de Autorización';
        titleEl.style.color = 'var(--hud-danger)';
        subTitleEl.textContent = 'Frontier ha rechazado la solicitud o se ha cancelado el inicio de sesión.';
        radarEl.style.display = 'none';
        statusEl.textContent = errorDesc || error;
        statusEl.style.color = 'var(--hud-danger)';
        statusEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
        statusEl.style.background = 'rgba(239, 68, 68, 0.1)';
        return;
      }

      if (!code) {
        titleEl.textContent = 'Esperando Autenticación';
        subTitleEl.textContent = 'No se ha detectado ningún código de autorización en la URL.';
        radarEl.style.display = 'none';
        statusEl.textContent = 'Abre TMC y pulsa «Vincular con Frontier» en la pestaña de Cuentas.';
        return;
      }

      // Código presente: mostrar detalles de respaldo
      codeView.textContent = code;
      manualBox.style.display = 'block';
      copyBtn.style.display = 'inline-flex';
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(code).then(() => {
          copyBtn.textContent = '¡Código Copiado!';
          setTimeout(() => { copyBtn.textContent = 'Copiar Código'; }, 2500);
        });
      });

      const currentRedirectUri = window.location.origin + window.location.pathname;
      const targetUrl = 'http://127.0.0.1:47320/api/auth/frontier/callback' +
        window.location.search +
        '&redirect_uri=' + encodeURIComponent(currentRedirectUri);

      directBtn.href = targetUrl;
      directBtn.style.display = 'inline-flex';

      // Transferir directamente mediante navegación a TMC local (evita peticiones duplicadas y bloqueos CORS)
      statusEl.textContent = 'Conectando con la cabina de TMC...';
      setTimeout(() => {
        window.location.replace(targetUrl);
      }, 600);
    })();
  </script>
</body>
</html>
